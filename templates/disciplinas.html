{% extends 'base.html' %}

{% block main %}
<hr>
<h1>Minhas Disciplinas</h1>

{% for d in lista_disciplinas %}
<div>
    <h2>{{ d.nome }}</h2>
    <p>{{ d.descricao }}</p>
    <a href="{{ url_for('conteudos.conteudo', disciplina_id=d.id) }}">Acessar Disciplina</a>
</div>
{% endfor %}

{% endfor %}
{% endblock %}
