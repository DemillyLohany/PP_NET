<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Entrando no N.E.T.</title>
<p id="mensagem" role="status">Confirmando acesso pelo SUAP…</p>
<a href="{{ url_for('home') }}">Voltar à Home</a>
<script>
  const mensagem = document.getElementById("mensagem");
  const dados = new URLSearchParams(location.hash.slice(1));
  const consulta = new URLSearchParams(location.search);
  const erro = dados.get("error") || consulta.get("error");
  history.replaceState(null, "", location.pathname);
  const corpo = erro || !dados.get("access_token")
    ? new URLSearchParams({falha: "1"})
    : new URLSearchParams({token: dados.get("access_token"), estado: dados.get("state") || consulta.get("state") || ""});
  fetch({{ url_for('perfil.confirmar_login') | tojson }}, {method: "POST", body: corpo})
    .then(() => location.replace({{ url_for('home') | tojson }}))
    .catch(() => { mensagem.textContent = "Não foi possível comunicar com o N.E.T. Volte à Home e tente novamente."; });
</script>
</html>
