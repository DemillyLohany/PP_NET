<header class="menu-principal">
  <a class="logo" href="{{ url_for('home') }}" aria-label="N.E.T. — Início">
    <img src="{{ url_for('static', filename='imagens/logo_menu.png') }}" alt="N.E.T.">
  </a>

  <form
    class="pesquisa-menu"
    action="{{ url_for('disciplinas.disciplinas') }}"
    method="get"
    role="search"
  >
    <label class="texto-acessivel" for="pesquisa-menu">Pesquisar</label>
    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    <input
      id="pesquisa-menu"
      name="q"
      type="search"
      value="{{ request.args.get('q', '') }}"
      placeholder="Procure o que precisa..."
    >
  </form>

  <nav class="menu-conteudo" aria-label="Navegação principal">
    <a class="{% if request.endpoint == 'home' %}ativo{% endif %}" href="{{ url_for('home') }}">Início</a>
    <a class="{% if request.endpoint == 'disciplinas.disciplinas' %}ativo{% endif %}" href="{{ url_for('disciplinas.disciplinas') }}">Disciplinas</a>
    <a class="{% if request.endpoint == 'notificacoes.tela_notificacoes' %}ativo{% endif %}" href="{{ url_for('notificacoes.tela_notificacoes') }}">Notificações</a>
    <a class="{% if request.endpoint == 'perfil.exibir_perfil' %}ativo{% endif %}" href="{{ url_for('perfil.exibir_perfil') }}">Perfil</a>
  </nav>
</header>
