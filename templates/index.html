{% extends 'base.html' %}

{% block head %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.0/css/bulma.min.css">
{% endblock %}

{% block nav %}
{% endblock %}

{% block main %}
<section class="section">
  <div class="container has-text-centered">
    <div class="is-anonymous content">
      <h2>Você não está autenticado</h2>
      <a class="button is-success is-large" id="suap-login-button">Login com SUAP</a>
    </div>
  </div>
</section>
{% endblock %}


{% block scripts %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="{{ url_for('static', filename='js.cookie.js') }}"></script>
  <script src="{{ url_for('static', filename='settings.js') }}"></script>
  <script src="{{ url_for('static', filename='client.js') }}"></script>
  <script>
    var suap = new SuapClient(SUAP_URL, CLIENT_ID, HOME_URI, REDIRECT_URI, SCOPE);
    suap.init();
    $(document).ready(function () {
        $("#suap-login-button").attr('href', suap.getLoginURL());
    });
  </script>
{% endblock %}
