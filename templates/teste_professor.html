{% extends 'base.html' %}
{% block title %}Professor de teste — N.E.T.{% endblock %}
{% block main %}
<section class="container" style="padding: 30px 0">
  <h1>Professor de teste</h1>
  <p>Conta fictícia para ensaio local. Não é uma conta do SUAP.</p>
  {% if erro %}<p role="alert">{{ erro }}</p>{% endif %}
  <form method="post">
    <label>Chave de teste <input type="password" name="chave" required></label>
    <button type="submit">Entrar para testar</button>
  </form>
</section>
{% endblock %}
