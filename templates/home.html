{% extends 'base.html' %}

{% block main %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <!-- botão de login -->
    <div align="right">
        <a href="#" id="suap-btn-login">
            <button class="home" type="button">Login &rarr;</button>
        </a>
    </div>

    <section class="inicio-hero container">
        <div class="inicio-texto">
            <h1>Boas-vindas ao N.E.T.</h1>
            <h2>Entre agora na jornada da programação!</h2>
        </div>

        <div class="inicio-imagem">
            <img
            src="{{ url_for('static', filename='imagens/img_home.png') }}"
            alt="Estudante usando um notebook"
            >
        </div>
    </section>

{% endblock %}

<!-- para integrar com o SUAP -->
{% block scripts %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="{{ url_for('static', filename='js.cookie.js') }}"></script>
  <script src="{{ url_for('static', filename='settings.js') }}"></script>
  <script src="{{ url_for('static', filename='client.js') }}"></script>
  <script>
    var clienteSuap = new SuapClient(SUAP_URL, CLIENT_ID, HOME_URI, REDIRECT_URI, SCOPE);
    clienteSuap.init();
    $(document).ready(function () {
        var urlLogin = clienteSuap.getLoginURL();
        $("#suap-btn-login").attr('href', urlLogin);
        $("#suap-btn-cadastro").attr('href', urlLogin);
    });
  </script>
{% endblock %}
