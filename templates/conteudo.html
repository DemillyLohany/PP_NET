{% extends 'base.html' %}

{% block main %}
<hr>

<div>
    <h3>[Modo Edição] Criar Novo Conteúdo para esta Disciplina</h3>
    <form action="" method="POST">
        <p><input type="text" name="titulo_conteudo" placeholder="Título do Conteúdo (Ex: Laços de Repetição)"></p>
        <button type="submit">Salvar Conteúdo</button>
    </form>
</div>

{% for c in conteudos %}
<div>
    <div>
        <h1>
            <a href="{{ url_for('materiais.ver_materiais', conteudo_id=c.id) }}">
                {{ c.titulo }}
            </a>
        </h1>
        <button type="button">[Excluir Conteúdo]</button>
    </div>
</div>
{% else %}
<p>Nenhum conteúdo cadastrado para esta disciplina ainda.</p>
{% endfor %}

{% endblock %}
